# Apache virtual host for QueryDeck. The DocumentRoot MUST be the public/ folder.
<VirtualHost *:80>
    ServerName querydeck.local
    DocumentRoot /var/www/querydeck/public

    <Directory /var/www/querydeck/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Never expose anything outside public/
    <DirectoryMatch "^/var/www/querydeck/(app|bin|config|database|resources|storage|tests|deploy)">
        Require all denied
    </DirectoryMatch>

    # Long-running queries / streamed exports
    Timeout 600
    ErrorLog ${APACHE_LOG_DIR}/querydeck-error.log
    CustomLog ${APACHE_LOG_DIR}/querydeck-access.log combined
</VirtualHost>
