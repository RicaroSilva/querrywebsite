# nginx + PHP-FPM configuration for QueryDeck (root = public/)
server {
    listen 80;
    server_name querydeck.example.com;
    root /var/www/querydeck/public;
    index index.php;

    client_max_body_size 16m;
    server_tokens off;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(?:css|js|svg|png|jpg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 600s;      # long queries
        fastcgi_buffering off;          # stream exports instead of buffering
    }

    # Any other .php or dotfile is refused
    location ~ \.php$ { return 404; }
    location ~ /\.   { deny all; }
}
