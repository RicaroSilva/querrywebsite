; QueryDeck PHP settings
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 512M
max_execution_time = 0          ; statement timeouts are enforced per query (QUERY_TIMEOUT_SECONDS)
post_max_size = 16M
upload_max_filesize = 8M
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
opcache.enable = 1
opcache.validate_timestamps = 0
